##############################################
###          Configuration file            ###
##############################################

# Add electrode with the following settings
use_electrode = T
use_dielectric = T

#dielectric%write = T

# Memory limit (GB):

# Ensure grid spacing around electrode is less than this value:
refine_electrode_dx = 1.000E-06         # was 5.0000E-05

# Whether the electrode is grounded or at the applied voltage:
field_electrode_grounded = F

field_bc_type="all_neumann"
#field_bc_type="homogeneous"


field_electrode_type = "user"

box_size = 4
coarse_grid_size = 128 128

field_rod_radius = 2.5e-4

user_circle_radius = 2.5e-4

user_powered1_pos  = 1.5e-3 6.71625e-3
user_powered2_pos  = 11.5e-3 6.71625e-3

user_grounded1_pos = 1.5e-3 6.28375e-3 
user_grounded2_pos = 11.5e-3 6.28375e-3 

user_cut_depth = 1e-4

cylindrical = F

# The desired endtime in seconds of the simulation:
end_time = 30e-9                          # was 40e-9

# The name of the simulation:
output%name = ./output/1bar_20O2_20ns_interpulse    # was output/streamer_cyl_2pulses

# The length of the (square) domain:
domain_len = 13e-3 13e-3              # was 16e-3 16e-3

# Whether the domain is periodic (per dimension):
periodic = F F

# The gas pressure in bar (used for photoionization):
gas%pressure = 1.0                        # was 0.1000E+01 (same value, just clearer)

#fixes%source_min_electrons_per_cell = 10000

#refine only up to this distance + if electron density is large enough
refine_min_dx =  1.0000E-06
refine_min_dens = 1e16

refine_adx =  1#1.0000E-00
#refine_buffer_width = 3

#dont refine inside the dielectric
refine_limits_dr   = 1e-3
refine_limits_rmin = 0.0  6.10375e-3
refine_limits_rmax = 13e-3 6.89625e-3

#for refinement mainly around the electrode
#refine_buffer_width = 1

prolong_density = 'zeroth'

# How the electric field or voltage is specified:
field_given_by = "voltage 16e3"            # was "voltage 34e3"

# Specifying the pulse parameters
field_rise_time  = 7.0e-9                 # was 2.5e-9   (old: 0.1000E-08)
field_pulse_width = 3.0e-9               # was 5.0e-9
field_num_pulses  = 1
field_pulse_period = 25e-9                # was 20e-9

# The background ion and electron density in 1/m^3:
background_density = 0e5               # was 0.1000E+15

seed_density = 1e12 1e12
seed_charge_type = -1 -1
seed_rel_r0 = 0.1154 0.5 0.8846 0.5
seed_rel_r1 = 0.1154 0.5 0.8846 0.5
seed_width = 5e-4 5e-4
seed_falloff = smoothstep smoothstep

# The timestep for writing output:
output%dt = 2.5e-10                       # was 0.200E-09

# ---- Time step control (from the elaborate cfg) ----
dt_min = 1.0000E-16
dt_safety_factor = 8.5000E-01
dt_chemistry_nmin = -1
dt_chemistry_limit_loss = F


# ---- Time integrator (from the elaborate cfg) ----
#time_integrator = 'ssprk33'

[photoi]
    enabled = T
    eta = 5.0000E-02
    method = 'helmholtz'
    per_steps = 10
    source_type = 'Zheleznyak'

[photoi_helmh]
    author = 'Bourdon-3'
    max_rel_residual = 1.0000E-02

# Input file with transport data:
input_data%file = ../../transport_data/BG_20O2_ext.txt   

#input_data%file = ../../transport_data/BG_20O2.txt   
#input_data%file = ../../transport_data/air_chemistry_v0.txt 

#input_data%file = ../../transport_data/N2_O2_simple_chemistry.txt
#input_data%old_style = F                   # was t

#input_data%file = ../../transport_data/td_air_siglo_swarm.txt
#input_data%old_style = t

